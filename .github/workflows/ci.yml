name: Validar
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: mes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --check app.mjs
          node --check spotify.mjs
          node --check card.mjs
          node --check test.mjs
      - run: node --test test.mjs
